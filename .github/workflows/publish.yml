name: Publish to NuGet

# Releases are cut by the main repo: bumping sdk/VERSION there makes its
# sdk-sync workflow regenerate this repo and push the v<VERSION> tag, and
# that tag push runs this.
#
# Needs one repository secret, NUGET_API_KEY: a nuget.org key scoped to
# the StripyHorse package id. --skip-duplicate keeps a re-run of an
# already-published version green instead of failing the release.
#
# With no key set the job skips and says so in the run summary rather
# than failing. A key that has not been created yet is a step Ben has not
# taken, not a broken release, and a red X on every tag until he takes it
# is how you learn to ignore the one that matters.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Pack
        run: dotnet pack src/StripyHorse/StripyHorse.csproj -c Release -o out
      - name: Push
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "### Nothing published" >> "$GITHUB_STEP_SUMMARY"
            echo "\`NUGET_API_KEY\` is not set on this repository, so \`$GITHUB_REF_NAME\` was built but not pushed to nuget.org." >> "$GITHUB_STEP_SUMMARY"
            echo "NUGET_API_KEY is not set; built but not published." >&2
            exit 0
          fi
          dotnet nuget push "out/*.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "$NUGET_API_KEY" --skip-duplicate
