      - explode: false
        in: path
        name: printerId
        required: true
        schema:
          type: string
        style: simple
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - bearerKey: []
      - headerKey: []
      summary: Delete a printer and its captured jobs
      tags:
      - Simulator
    get:
      operationId: getPrinter
      parameters:
      - explode: false
        in: path
        name: printerId
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrinterBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - bearerKey: []
      - headerKey: []
      summary: Get a printer with live state
      tags:
      - Simulator
    patch:
      operationId: updatePrinter
      parameters:
      - explode: false
        in: path
        name: printerId
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePrinterInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrinterBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - bearerKey: []
      - headerKey: []
      summary: Rename a printer or set its webhook URL
      tags:
      - Simulator
  /v1/printers/{printerId}/faults:
    post:
      description: Blocking faults hold incoming jobs in the receive buffer; clearing
        them flushes the queue in order.
      operationId: setPrinterFaults
      parameters:
      - explode: false
        in: path
        name: printerId
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Faults"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StateOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - bearerKey: []
      - headerKey: []
      summary: Inject or clear fault conditions
      tags:
      - Simulator
      x-codeSamples:
      - lang: bash
        label: curl
        source: |-
          STRIPY_HORSE_API_KEY=""
          curl https://api.stripyhorse.io/v1/printers/$PRINTER_ID/faults \
            -H "X-Api-Key: $STRIPY_HORSE_API_KEY" -H "Content-Type: application/json" \
            -d '{"paperOut":true}'
      - lang: go
        label: Go
        source: |-
          faults := stripyhorse.NewFaults()
          faults.SetPaperOut(true)
          client.SimulatorAPI.SetPrinterFaults(ctx, printer.GetId()).Faults(*faults).Execute()
          // print something - it holds. Clear to flush:
          client.SimulatorAPI.SetPrinterFaults(ctx, printer.GetId()).Faults(*stripyhorse.NewFaults()).Execute()
      - lang: php
        label: PHP
        source: |-
          $sim->setPrinterFaults($printerId, new StripyHorse\Model\Faults(['paper_out' => true]));
          // print something - it holds. Clear to flush:
          $sim->setPrinterFaults($printerId, new StripyHorse\Model\Faults());
      - lang: python
        label: Python
        source: |-
          sim.set_printer_faults(printer.id, Faults(paper_out=True))
          # print something - it holds. Clear to flush:
          sim.set_printer_faults(printer.id, Faults())
      - lang: csharp
        label: C#
        source: |-
          sim.SetPrinterFaults(printer.Id, new Faults(paperOut: true));
          // print something - it holds. Clear to flush:
          sim.SetPrinterFaults(printer.Id, new Faults());
      - lang: java
        label: Java
        source: |-
          sim.setPrinterFaults(printer.getId(), new Faults().paperOut(true));
          // print something - it holds. Clear to flush:
          sim.setPrinterFaults(printer.getId(), new Faults());
  /v1/printers/{printerId}/jobs:
    delete:
      operationId: clearJobs
      parameters:
      - explode: false
        in: path
        name: printerId
        required: true
        schema:
          type: string
        style: simple
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - bearerKey: []
      - headerKey: []
      summary: Delete all captured jobs
      tags:
      - Simulator
    get:
      description: For CI assertions and inbox views. Cursor-paged via before.
      operationId: listJobs
      parameters:
      - explode: false
        in: path
        name: printerId
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: query
        name: limit
        required: false
        schema:
          default: 50
          format: int64
          maximum: 200
          minimum: 1
          type: integer
        style: form
      - description: Return jobs with id lower than this cursor
        explode: false
        in: query
        name: before
        required: false
        schema:
          description: Return jobs with id lower than this cursor
          format: int64
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListJobsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - bearerKey: []
      - headerKey: []
      summary: "List captured jobs, newest first"
      tags:
      - Simulator
      x-codeSamples:
      - lang: bash
        label: curl
        source: |-
          STRIPY_HORSE_API_KEY=""
          curl https://api.stripyhorse.io/v1/printers/$PRINTER_ID/jobs \
            -H "X-Api-Key: $STRIPY_HORSE_API_KEY"
      - lang: go
        label: Go
        source: |-
          jobs, _, err := client.SimulatorAPI.ListJobs(ctx, printer.GetId()).Execute()
          if err != nil {
              log.Fatal(err)
          }
          if len(jobs.GetJobs()) != 1 {
              log.Fatalf("expected 1 job, got %d", len(jobs.GetJobs()))
          }
          if jobs.GetJobs()[0].GetStatus() != "rendered" {
              log.Fatal("job did not render")
          }
      - lang: php
        label: PHP
        source: |-
          $jobs = $sim->listJobs($printerId);
          assert(count($jobs->getJobs()) === 1);
          assert($jobs->getJobs()[0]->getStatus() === 'rendered');
      - lang: python
        label: Python
        source: |-
          jobs = sim.list_jobs(printer.id)
          assert len(jobs.jobs) == 1
          assert jobs.jobs[0].status == "rendered"
      - lang: csharp
        label: C#
        source: |-
          var jobs = sim.ListJobs(printer.Id);
          Debug.Assert(jobs.Jobs.Count == 1);
          Debug.Assert(jobs.Jobs[0].Status == "rendered");
      - lang: java
        label: Java
        source: |-
          ListJobsOutputBody jobs = sim.listJobs(printer.getId(), null, null);
          assert jobs.getJobs().size() == 1;
          assert "rendered".equals(jobs.getJobs().get(0).getStatus());
