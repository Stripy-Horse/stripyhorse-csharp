      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StateOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - bearerKey: []
      - headerKey: []
      summary: Clear all faults and flush held jobs
      tags:
      - Simulator
  /v1/render:
    post:
      description: Renders every label in the ZPL stream. For a raw PNG of a single
        label use renderZplPng.
      operationId: renderZpl
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenderInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RenderOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - bearerKey: []
      - headerKey: []
      summary: Render ZPL to PNG images
      tags:
      - Render
      x-codeSamples:
      - lang: bash
        label: curl
        source: |-
          curl https://api.stripyhorse.io/v1/render \
            -H "X-Api-Key: sh_live_YOUR_KEY" -H "Content-Type: application/json" \
            -d '{"zpl":"^XA^FO50,50^A0N,45,45^FDHello^FS^XZ","preset":"4x6"}'
      - lang: php
        label: PHP
        source: |-
          $render = new StripyHorse\Api\RenderApi(null, $config);
          $out = $render->renderZpl(new StripyHorse\Model\RenderInputBody([
              'zpl' => '^XA^FO50,50^A0N,45,45^FDHello^FS^XZ', 'preset' => '4x6',
          ]));
          file_put_contents('label.png', base64_decode($out->getLabels()[0]->getPng()));
      - lang: python
        label: Python
        source: |-
          render = RenderApi(client)
          out = render.render_zpl(RenderInputBody(
              zpl="^XA^FO50,50^A0N,45,45^FDHello^FS^XZ", preset="4x6"))
          with open("label.png", "wb") as f:
              f.write(base64.b64decode(out.labels[0].png))
      - lang: csharp
        label: C#
        source: |-
          var render = new RenderApi(config);
          var outp = render.RenderZpl(new RenderInputBody(
              zpl: "^XA^FO50,50^A0N,45,45^FDHello^FS^XZ",
              preset: RenderInputBody.PresetEnum._4x6));
          File.WriteAllBytes("label.png", Convert.FromBase64String(outp.Labels[0].Png));
      - lang: java
        label: Java
        source: |-
          RenderApi render = new RenderApi(client);
          RenderOutputBody out = render.renderZpl(new RenderInputBody()
              .zpl("^XA^FO50,50^A0N,45,45^FDHello^FS^XZ")
              .preset(RenderInputBody.PresetEnum._4X6));
          Files.write(Path.of("label.png"),
              Base64.getDecoder().decode(out.getLabels().get(0).getPng()));
  /v1/render.png:
    post:
      description: "curl-friendly variant: the X-Label-Count response header carries\
        \ the total label count."
      operationId: renderZplPng
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenderInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                type: string
          description: OK
          headers:
            Content-Type:
              explode: false
              schema:
                type: string
              style: simple
            X-Label-Count:
              explode: false
              schema:
                format: int64
                type: integer
              style: simple
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - bearerKey: []
      - headerKey: []
      summary: Render ZPL and return the first label as a raw PNG
      tags:
      - Render
      x-codeSamples:
      - lang: bash
        label: curl
        source: |-
          curl https://api.stripyhorse.io/v1/render.png \
            -H "X-Api-Key: sh_live_YOUR_KEY" -H "Content-Type: application/json" \
            -d '{"zpl":"^XA^FO50,50^A0N,45,45^FDHello^FS^XZ","preset":"4x6"}' -o label.png
      - lang: php
        label: PHP
        source: |-
          $png = (new StripyHorse\Api\RenderApi(null, $config))
              ->renderZplPng(new StripyHorse\Model\RenderInputBody(['zpl' => $zpl, 'preset' => '4x6']));
      - lang: python
        label: Python
        source: "png = RenderApi(client).render_zpl_png(RenderInputBody(zpl=zpl, preset=\"\
          4x6\"))"
  /v1/unicode:
    post:
      description: "Text fields containing characters the printer's fonts can't render\
        \ — Arabic (contextual joining, RTL), Cyrillic, and everything else beyond\
        \ ASCII — are shaped properly and re-emitted as ^GFA bitmaps at the field's\
        \ exact position and size. Every other byte (barcodes, ASCII text, graphics)\
        \ passes through untouched. Fields that can't be converted safely (rotated,\
        \ ^FH-escaped) are left unchanged and reported in `skipped`."
      operationId: rasterizeUnicode
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnicodeInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnicodeOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - bearerKey: []
      - headerKey: []
      summary: Make Unicode ZPL printable on any Zebra
      tags:
      - Convert
  /v1/void:
    post:
      description: "Overlays large DO NOT SHIP warnings (and an optional attribution\
        \ stamp) across every label in the stream, so printed dev and test labels\
        \ can never be mistaken for shippable ones. Original fields are untouched;\
        \ stamps draw on top."
      operationId: voidZpl
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoidInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoidOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - bearerKey: []
      - headerKey: []
      summary: Stamp ZPL as void / do-not-ship
      tags:
      - Convert
