openapi: 3.1.0
info:
  description: "Zebra/ZPL developer tools: render ZPL to PNG, convert PDFs and images\
    \ to print-ready ZPL, and drive hosted virtual Zebra printers for testing. Authenticate\
    \ with an API key via `Authorization: Bearer sh_live_…` or `X-Api-Key`."
  title: Stripy Horse API
  version: 1.0.0
servers:
- url: https://api.stripyhorse.io
- url: https://stripyhorse.io
paths:
  /v1/convert:
    post:
      description: Each page becomes its own ^GFA command (Zebra ACS run-length compression).
        PDFs up to 16 pages.
      operationId: convertDocument
      requestBody:
        content:
          multipart/form-data:
            encoding:
              barcodeAware:
                contentType: text/plain
                style: form
              compression:
                contentType: text/plain
                style: form
              dpmm:
                contentType: text/plain
                style: form
              file:
                contentType: application/octet-stream
                style: form
              heightMm:
                contentType: text/plain
                style: form
              preset:
                contentType: text/plain
                style: form
              rotation:
                contentType: text/plain
                style: form
              scale:
                contentType: text/plain
                style: form
              threshold:
                contentType: text/plain
                style: form
              widthMm:
                contentType: text/plain
                style: form
            schema:
              $ref: "#/components/schemas/convertDocument_request"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConvertOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - bearerKey: []
      - headerKey: []
      summary: Convert a PDF or image to ZPL
      tags:
      - Convert
      x-codeSamples:
      - lang: bash
        label: curl
        source: |-
          STRIPY_HORSE_API_KEY=""
          curl https://api.stripyhorse.io/v1/convert \
            -H "X-Api-Key: $STRIPY_HORSE_API_KEY" -F file=@shipping-label.pdf -F preset=4x6
      - lang: go
        label: Go
        source: |-
          pdf, _ := os.Open("shipping-label.pdf")
          defer pdf.Close()
          result, _, err := client.ConvertAPI.ConvertDocument(ctx).File(pdf).Preset("4x6").Execute()
          if err != nil {
              log.Fatal(err)
          }
          for _, page := range result.GetPages() {
              sendToPrinter(page.GetZpl())
          }
      - lang: php
        label: PHP
        source: |-
          $convert = new StripyHorse\Api\ConvertApi(null, $config);
          $result = $convert->convertDocument(new SplFileObject('shipping-label.pdf'), preset: '4x6');
          foreach ($result->getPages() as $page) { sendToPrinter($page->getZpl()); }
      - lang: python
        label: Python
        source: |-
          convert = ConvertApi(client)
          result = convert.convert_document(file="shipping-label.pdf", preset="4x6")
          for page in result.pages:
              send_to_printer(page.zpl)
      - lang: csharp
        label: C#
        source: |-
          var convert = new ConvertApi(config);
          using var pdf = File.OpenRead("shipping-label.pdf");
          var result = convert.ConvertDocument(pdf, preset: "4x6");
          foreach (var page in result.Pages)
              SendToPrinter(page.Zpl);
      - lang: java
        label: Java
        source: |-
          ConvertApi convert = new ConvertApi(client);
          ConvertOutputBody result = convert.convertDocument(
              new File("shipping-label.pdf"),
              null, null, null, null, "4x6", null, null, null, null);
          for (ConvertedPage page : result.getPages())
              sendToPrinter(page.getZpl());
  /v1/convert/batch:
    post:
      description: "Upload up to 20 PDFs/images as repeated `files` fields. The response\
        \ is application/x-ndjson: one JSON object per converted page, streamed as\
        \ each page finishes: `{\"file\":…,\"page\":…,\"pageCount\":…,\"zpl\":…}`\
        \ on success, `{\"file\":…,\"error\":…}` per failed file (remaining files\
        \ still convert)."
      operationId: convertBatch
      requestBody:
        content:
          multipart/form-data:
            encoding:
              barcodeAware:
                contentType: text/plain
                style: form
              compression:
                contentType: text/plain
                style: form
              dpmm:
                contentType: text/plain
                style: form
              files:
                contentType: application/octet-stream
                style: form
              heightMm:
                contentType: text/plain
                style: form
              preset:
                contentType: text/plain
                style: form
              rotation:
                contentType: text/plain
                style: form
              scale:
                contentType: text/plain
                style: form
              threshold:
                contentType: text/plain
                style: form
              widthMm:
                contentType: text/plain
                style: form
            schema:
              $ref: "#/components/schemas/convertBatch_request"
      responses:
        "200":
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - bearerKey: []
      - headerKey: []
      summary: "Convert many documents in one request, results streamed"
      tags:
      - Convert
  /v1/convert/html:
    post:
      description: |-
        Renders the HTML at exact print resolution (headless Chrome, network access blocked) and rasterizes it, except `<zpl-barcode type="code128|qr" data="…">` elements, which are measured from the layout and emitted as native ^BC/^BQ fields at their exact boxes. Size and position them with CSS (`left/top/width/height`); optional `module` (^BY dots) and `mag` (QR magnification) attributes pin exact bar geometry instead of fitting it to the box. Unsupported types or unencodable data fail loudly.

        **PHP** (`composer require stripyhorse/stripyhorse-php`):
        ```php
        $out = $convert->convertHtml(new StripyHorse\Model\HtmlInputBody([
            'html' => '<div style="position:absolute;left:40px;top:40px;font-size:50px">Hello</div>',
            'preset' => '4x6',
        ]));
        echo $out->getZpl();
        ```
      operationId: convertHtml
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HtmlInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HtmlOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - bearerKey: []
      - headerKey: []
      summary: Convert an HTML label design to ZPL
      tags:
      - Convert
      x-codeSamples:
      - lang: bash
        label: curl
        source: |-
          STRIPY_HORSE_API_KEY=""
          curl https://api.stripyhorse.io/v1/convert/html \
            -H "X-Api-Key: $STRIPY_HORSE_API_KEY" -H "Content-Type: application/json" \
            -d '{"html":"<div style=\"position:absolute;left:40px;top:40px;font-size:50px\">Hello</div>","preset":"4x6"}'
      - lang: go
        label: Go
        source: |-
          body := stripyhorse.NewHtmlInputBody(`<div style="position:absolute;left:40px;top:40px;font-size:50px">Hello</div>`)
          body.SetPreset("4x6")
          out, _, err := client.ConvertAPI.ConvertHtml(ctx).HtmlInputBody(*body).Execute()
          if err != nil {
              log.Fatal(err)
          }
          fmt.Println(out.GetZpl())
      - lang: php
        label: PHP
        source: |-
          $out = $convert->convertHtml(new StripyHorse\Model\HtmlInputBody([
              'html' => '<div style="position:absolute;left:40px;top:40px;font-size:50px">Hello</div>',
              'preset' => '4x6',
          ]));
          echo $out->getZpl();
      - lang: python
        label: Python
        source: |-
          out = convert.convert_html(HtmlInputBody(
              html='<div style="position:absolute;left:40px;top:40px;font-size:50px">Hello</div>',
              preset="4x6"))
          print(out.zpl)
      - lang: csharp
        label: C#
        source: |-
          var outp = convert.ConvertHtml(new HtmlInputBody(
              html: """<div style="position:absolute;left:40px;top:40px;font-size:50px">Hello</div>""",
              preset: HtmlInputBody.PresetEnum._4x6));
          Console.WriteLine(outp.Zpl);
      - lang: java
        label: Java
        source: |-
          HtmlOutputBody out = convert.convertHtml(new HtmlInputBody()
              .html("<div style=\"position:absolute;left:40px;top:40px;font-size:50px\">Hello</div>")
              .preset(HtmlInputBody.PresetEnum._4X6));
          System.out.println(out.getZpl());
  /v1/convert/zpl-html:
    post:
      description: "The migration path for legacy ZPL templates: text, boxes and Code128/QR\
        \ barcodes become editable HTML in the dialect convertHtml accepts; unsupported\
        \ elements (raster graphics, exotic barcodes) are embedded as positioned images\
        \ so the layout survives. Round-tripping through convertHtml preserves scannable\
        \ barcodes."
      operationId: convertZplToHtml
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ZplHTMLInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZplHTMLOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - bearerKey: []
      - headerKey: []
      summary: Decompile ZPL into editable HTML
      tags:
      - Convert
  /v1/host-status/parse:
    post:
      description: "Parses the three-line ~HS answer a Zebra printer (or our virtual\
        \ printer) returns on port 9100 into typed fields - paper out, pause, buffer\
        \ contents, head temperature - so you never write a positional comma parser.\
        \ Accepts raw bytes, cat -v style ^B/^C markers, or hand-cleaned lines. Does\
        \ not count against your monthly quota."
      operationId: parseHostStatus
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HostStatusInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostStatusOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - bearerKey: []
      - headerKey: []
      summary: Decode a Zebra ~HS host status response
      tags:
      - Printers
  /v1/labels/compose:
    post:
      description: "Labels as JSON: place text, barcodes (code128/39, QR, DataMatrix),\
        \ boxes, lines, circles, images and raw ZPL passthrough on a label and get\
        \ back ZPL - optionally with rendered previews. {{name}} in text/data interpolates\
        \ from the variables map; an unresolved variable is an error, never a blank\
        \ on a real shipment. Positions are printer dots."
      operationId: composeLabel
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComposeInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComposeOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - bearerKey: []
      - headerKey: []
      summary: Compose ZPL from typed JSON elements
      tags:
      - Compose
      x-codeSamples:
      - lang: bash
        label: curl
        source: |-
          STRIPY_HORSE_API_KEY=""
          curl https://api.stripyhorse.io/v1/labels/compose \
            -H "X-Api-Key: $STRIPY_HORSE_API_KEY" -H "Content-Type: application/json" \
            -d '{
              "preset": "4x6",
              "variables": {"name": "Debbie Root", "track": "420546188580"},
              "elements": [
                {"type": "text", "x": 50, "y": 40, "text": "{{name}}", "fontHeight": 40},
                {"type": "barcode128", "x": 50, "y": 200, "data": "{{track}}", "height": 140},
                {"type": "box", "x": 20, "y": 20, "width": 770, "height": 400, "thickness": 3}
              ]
            }'
  /v1/preflight:
    post:
      description: "Renders the ZPL and grades every barcode the way a verifier grades\
        \ a printed label: round-trip decode, measured module width in printer dots,\
        \ dot-grid alignment (catches rasterized barcodes), quiet zones in modules,\
        \ physical X-dimension against the spec minimum, blur tolerance, and a cross-density\
        \ table - plus static lint findings (structure, encoding traps, out-of-bounds\
        \ fields). Grade fail means a scanner will reject it; fix it before a truck\
        \ does."
      operationId: preflightLabel
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreflightInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreflightOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - bearerKey: []
      - headerKey: []
      summary: Grade a label's barcodes before they ship
      tags:
      - Render
  /v1/printers:
    get:
      operationId: listPrinters
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListPrintersOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - bearerKey: []
      - headerKey: []
      summary: List your printers
      tags:
      - Simulator
    post:
      description: "Free tier: one ephemeral printer (24h idle TTL). Paid tiers: persistent\
        \ printers. The ingest URL and webhook secret are only returned here."
      operationId: createPrinter
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePrinterInputBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrinterBody"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - bearerKey: []
      - headerKey: []
      summary: Create a virtual printer
      tags:
      - Simulator
      x-codeSamples:
      - lang: bash
        label: curl
        source: |-
          STRIPY_HORSE_API_KEY=""
          curl https://api.stripyhorse.io/v1/printers \
            -H "X-Api-Key: $STRIPY_HORSE_API_KEY" -H "Content-Type: application/json" \
            -d '{"name":"ci-run-42","preset":"4x6"}'
      - lang: go
        label: Go
        source: |-
          body := stripyhorse.NewCreatePrinterInputBody("ci-run-42")
          body.SetPreset("4x6")
          printer, _, err := client.SimulatorAPI.CreatePrinter(ctx).CreatePrinterInputBody(*body).Execute()
          if err != nil {
              log.Fatal(err)
          }
          addr := fmt.Sprintf("%s:%d", printer.GetTcp().GetHost(), printer.GetTcp().GetPort())
          // point the system under test at addr, then assert with ListJobs
      - lang: php
        label: PHP
        source: |-
          $sim = new StripyHorse\Api\SimulatorApi(null, $config);
          $printer = $sim->createPrinter(new StripyHorse\Model\CreatePrinterInputBody([
              'name' => 'ci-run-42', 'preset' => '4x6',
          ]));
          $addr = $printer->getTcp()->getHost() . ':' . $printer->getTcp()->getPort();
          // point the system under test at $addr, then assert with listJobs
      - lang: python
        label: Python
        source: |-
          sim = SimulatorApi(client)
          printer = sim.create_printer(CreatePrinterInputBody(name="ci-run-42", preset="4x6"))
          addr = f"{printer.tcp.host}:{printer.tcp.port}"
          # point the system under test at addr, then assert with list_jobs
      - lang: csharp
        label: C#
        source: |-
          var sim = new SimulatorApi(config);
          var printer = sim.CreatePrinter(new CreatePrinterInputBody(
              name: "ci-run-42", preset: CreatePrinterInputBody.PresetEnum._4x6));
          var addr = $"{printer.Tcp.Host}:{printer.Tcp.Port}";
          // point the system under test at addr, then assert with ListJobs
      - lang: java
        label: Java
        source: |-
          SimulatorApi sim = new SimulatorApi(client);
          PrinterBody printer = sim.createPrinter(new CreatePrinterInputBody()
              .name("ci-run-42").preset(CreatePrinterInputBody.PresetEnum._4X6));
          String addr = printer.getTcp().getHost() + ":" + printer.getTcp().getPort();
          // point the system under test at addr, then assert with listJobs
  /v1/printers/{printerId}:
    delete:
      operationId: deletePrinter
