          description: OK
          headers:
            Content-Type:
              explode: false
              schema:
                type: string
              style: simple
            X-Label-Count:
              explode: false
              schema:
                format: int64
                type: integer
              style: simple
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - bearerKey: []
      - headerKey: []
      summary: Render ZPL and return the first label as a raw PNG
      tags:
      - Render
      x-codeSamples:
      - lang: bash
        label: curl
        source: |-
          STRIPY_HORSE_API_KEY=""
          curl https://api.stripyhorse.io/v1/render.png \
            -H "X-Api-Key: $STRIPY_HORSE_API_KEY" -H "Content-Type: application/json" \
            -d '{"zpl":"^XA^FO50,50^A0N,45,45^FDHello^FS^XZ","preset":"4x6"}' -o label.png
      - lang: go
        label: Go
        source: |-
          body := stripyhorse.NewRenderInputBody("^XA^FO50,50^A0N,45,45^FDHello^FS^XZ")
          body.SetPreset("4x6")
          png, _, err := client.RenderAPI.RenderZplPng(ctx).RenderInputBody(*body).Execute()
          os.WriteFile("label.png", []byte(png), 0o644)
      - lang: php
        label: PHP
        source: |-
          $png = (new StripyHorse\Api\RenderApi(null, $config))
              ->renderZplPng(new StripyHorse\Model\RenderInputBody(['zpl' => $zpl, 'preset' => '4x6']));
      - lang: python
        label: Python
        source: "png = RenderApi(client).render_zpl_png(RenderInputBody(zpl=zpl, preset=\"\
          4x6\"))"
  /v1/stamp:
    post:
      description: "Bakes a PNG/GIF/JPEG (a logo, a QA stamp, a brand mark) onto every\
        \ label in the stream as a positioned graphic field drawn over the existing\
        \ content. Position and width are in printer dots; height follows the image's\
        \ aspect ratio."
      operationId: stampZpl
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StampInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StampOutputBody"
          description: OK
        default:
