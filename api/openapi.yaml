openapi: 3.1.0
info:
  description: "Zebra/ZPL developer tools: render ZPL to PNG, convert PDFs and images\
    \ to print-ready ZPL, and drive hosted virtual Zebra printers for testing. Authenticate\
    \ with an API key via `Authorization: Bearer sh_live_…` or `X-Api-Key`."
  title: Stripy Horse API
  version: 1.0.0
servers:
- url: https://api.stripyhorse.io
- url: https://stripyhorse.io
paths:
  /v1/convert:
    post:
      description: Each page becomes its own ^GFA command (Zebra ACS run-length compression).
        PDFs up to 16 pages.
      operationId: convertDocument
      requestBody:
        content:
          multipart/form-data:
            encoding:
              barcodeAware:
                contentType: text/plain
                style: form
              compression:
                contentType: text/plain
                style: form
              dpmm:
                contentType: text/plain
                style: form
              file:
                contentType: application/octet-stream
                style: form
              heightMm:
                contentType: text/plain
                style: form
              preset:
                contentType: text/plain
                style: form
              rotation:
                contentType: text/plain
                style: form
              scale:
                contentType: text/plain
                style: form
              threshold:
                contentType: text/plain
                style: form
              widthMm:
                contentType: text/plain
                style: form
            schema:
              $ref: "#/components/schemas/convertDocument_request"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConvertOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - bearerKey: []
      - headerKey: []
      summary: Convert a PDF or image to ZPL
      tags:
      - Convert
      x-codeSamples:
      - lang: bash
        label: curl
        source: |-
          curl https://api.stripyhorse.io/v1/convert \
            -H "X-Api-Key: sh_live_YOUR_KEY" -F file=@shipping-label.pdf -F preset=4x6
      - lang: php
        label: PHP
        source: |-
          $convert = new StripyHorse\Api\ConvertApi(null, $config);
          $result = $convert->convertDocument(new SplFileObject('shipping-label.pdf'), preset: '4x6');
          foreach ($result->getPages() as $page) { sendToPrinter($page->getZpl()); }
      - lang: python
        label: Python
        source: |-
          convert = ConvertApi(client)
          result = convert.convert_document(file="shipping-label.pdf", preset="4x6")
          for page in result.pages:
              send_to_printer(page.zpl)
      - lang: csharp
        label: C#
        source: |-
          var convert = new ConvertApi(config);
          using var pdf = File.OpenRead("shipping-label.pdf");
          var result = convert.ConvertDocument(pdf, preset: "4x6");
          foreach (var page in result.Pages)
              SendToPrinter(page.Zpl);
      - lang: java
        label: Java
        source: |-
          ConvertApi convert = new ConvertApi(client);
          ConvertOutputBody result = convert.convertDocument(
              new File("shipping-label.pdf"),
              null, null, null, null, "4x6", null, null, null, null);
          for (ConvertedPage page : result.getPages())
              sendToPrinter(page.getZpl());
  /v1/convert/batch:
    post:
      description: "Upload up to 20 PDFs/images as repeated `files` fields. The response\
        \ is application/x-ndjson: one JSON object per converted page, streamed as\
        \ each page finishes — `{\"file\":…,\"page\":…,\"pageCount\":…,\"zpl\":…}`\
        \ on success, `{\"file\":…,\"error\":…}` per failed file (remaining files\
        \ still convert)."
      operationId: convertBatch
      requestBody:
        content:
          multipart/form-data:
            encoding:
              barcodeAware:
                contentType: text/plain
                style: form
              compression:
                contentType: text/plain
                style: form
              dpmm:
                contentType: text/plain
                style: form
              files:
                contentType: application/octet-stream
                style: form
              heightMm:
                contentType: text/plain
                style: form
              preset:
                contentType: text/plain
                style: form
              rotation:
                contentType: text/plain
                style: form
              scale:
                contentType: text/plain
                style: form
              threshold:
                contentType: text/plain
                style: form
              widthMm:
                contentType: text/plain
                style: form
            schema:
              $ref: "#/components/schemas/convertBatch_request"
      responses:
        "200":
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - bearerKey: []
      - headerKey: []
      summary: "Convert many documents in one request, results streamed"
      tags:
      - Convert
  /v1/convert/html:
    post:
      description: |-
        Renders the HTML at exact print resolution (headless Chrome, network access blocked) and rasterizes it — except `<zpl-barcode type="code128|qr" data="…">` elements, which are measured from the layout and emitted as native ^BC/^BQ fields at their exact boxes. Size and position them with CSS (`left/top/width/height`); optional `module` (^BY dots) and `mag` (QR magnification) attributes pin exact bar geometry instead of fitting it to the box. Unsupported types or unencodable data fail loudly.

        **PHP** (`composer require stripyhorse/stripyhorse-php`):
        ```php
        $out = $convert->convertHtml(new StripyHorse\Model\HtmlInputBody([
            'html' => '<div style="position:absolute;left:40px;top:40px;font-size:50px">Hello</div>',
            'preset' => '4x6',
        ]));
        echo $out->getZpl();
        ```
      operationId: convertHtml
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HtmlInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HtmlOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - bearerKey: []
      - headerKey: []
      summary: Convert an HTML label design to ZPL
      tags:
      - Convert
      x-codeSamples:
      - lang: bash
        label: curl
        source: |-
          curl https://api.stripyhorse.io/v1/convert/html \
            -H "X-Api-Key: sh_live_YOUR_KEY" -H "Content-Type: application/json" \
            -d '{"html":"<div style=\"position:absolute;left:40px;top:40px;font-size:50px\">Hello</div>","preset":"4x6"}'
      - lang: php
        label: PHP
        source: |-
          $out = $convert->convertHtml(new StripyHorse\Model\HtmlInputBody([
              'html' => '<div style="position:absolute;left:40px;top:40px;font-size:50px">Hello</div>',
              'preset' => '4x6',
          ]));
          echo $out->getZpl();
      - lang: python
        label: Python
        source: |-
          out = convert.convert_html(HtmlInputBody(
              html='<div style="position:absolute;left:40px;top:40px;font-size:50px">Hello</div>',
              preset="4x6"))
          print(out.zpl)
      - lang: csharp
        label: C#
        source: |-
          var outp = convert.ConvertHtml(new HtmlInputBody(
              html: """<div style="position:absolute;left:40px;top:40px;font-size:50px">Hello</div>""",
              preset: HtmlInputBody.PresetEnum._4x6));
          Console.WriteLine(outp.Zpl);
      - lang: java
        label: Java
        source: |-
          HtmlOutputBody out = convert.convertHtml(new HtmlInputBody()
              .html("<div style=\"position:absolute;left:40px;top:40px;font-size:50px\">Hello</div>")
              .preset(HtmlInputBody.PresetEnum._4X6));
          System.out.println(out.getZpl());
  /v1/convert/zpl-html:
    post:
      description: "The migration path for legacy ZPL templates: text, boxes and Code128/QR\
        \ barcodes become editable HTML in the dialect convertHtml accepts; unsupported\
        \ elements (raster graphics, exotic barcodes) are embedded as positioned images\
        \ so the layout survives. Round-tripping through convertHtml preserves scannable\
        \ barcodes."
      operationId: convertZplToHtml
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ZplHTMLInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZplHTMLOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - bearerKey: []
      - headerKey: []
      summary: Decompile ZPL into editable HTML
      tags:
      - Convert
  /v1/printers:
    get:
      operationId: listPrinters
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListPrintersOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - bearerKey: []
      - headerKey: []
      summary: List your printers
      tags:
      - Simulator
    post:
      description: "Free tier: one ephemeral printer (24h idle TTL). Paid tiers: persistent\
        \ printers. The ingest URL and webhook secret are only returned here."
      operationId: createPrinter
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePrinterInputBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrinterBody"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - bearerKey: []
      - headerKey: []
      summary: Create a virtual printer
      tags:
      - Simulator
      x-codeSamples:
      - lang: bash
        label: curl
        source: |-
          curl https://api.stripyhorse.io/v1/printers \
            -H "X-Api-Key: sh_live_YOUR_KEY" -H "Content-Type: application/json" \
            -d '{"name":"ci-run-42","preset":"4x6"}'
      - lang: php
        label: PHP
        source: |-
          $sim = new StripyHorse\Api\SimulatorApi(null, $config);
          $printer = $sim->createPrinter(new StripyHorse\Model\CreatePrinterInputBody([
              'name' => 'ci-run-42', 'preset' => '4x6',
          ]));
          $addr = $printer->getTcp()->getHost() . ':' . $printer->getTcp()->getPort();
          // point the system under test at $addr, then assert with listJobs
      - lang: python
        label: Python
        source: |-
          sim = SimulatorApi(client)
          printer = sim.create_printer(CreatePrinterInputBody(name="ci-run-42", preset="4x6"))
          addr = f"{printer.tcp.host}:{printer.tcp.port}"
          # point the system under test at addr, then assert with list_jobs
      - lang: csharp
        label: C#
        source: |-
          var sim = new SimulatorApi(config);
          var printer = sim.CreatePrinter(new CreatePrinterInputBody(
              name: "ci-run-42", preset: CreatePrinterInputBody.PresetEnum._4x6));
          var addr = $"{printer.Tcp.Host}:{printer.Tcp.Port}";
          // point the system under test at addr, then assert with ListJobs
      - lang: java
        label: Java
        source: |-
          SimulatorApi sim = new SimulatorApi(client);
          PrinterBody printer = sim.createPrinter(new CreatePrinterInputBody()
              .name("ci-run-42").preset(CreatePrinterInputBody.PresetEnum._4X6));
          String addr = printer.getTcp().getHost() + ":" + printer.getTcp().getPort();
          // point the system under test at addr, then assert with listJobs
  /v1/printers/{printerId}:
    delete:
      operationId: deletePrinter
      parameters:
      - explode: false
        in: path
        name: printerId
        required: true
        schema:
          type: string
        style: simple
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - bearerKey: []
      - headerKey: []
      summary: Delete a printer and its captured jobs
      tags:
      - Simulator
    get:
      operationId: getPrinter
      parameters:
      - explode: false
        in: path
        name: printerId
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrinterBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - bearerKey: []
      - headerKey: []
      summary: Get a printer with live state
      tags:
      - Simulator
    patch:
      operationId: updatePrinter
      parameters:
      - explode: false
        in: path
        name: printerId
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePrinterInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrinterBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - bearerKey: []
      - headerKey: []
      summary: Rename a printer or set its webhook URL
      tags:
      - Simulator
  /v1/printers/{printerId}/faults:
    post:
      description: Blocking faults hold incoming jobs in the receive buffer; clearing
        them flushes the queue in order.
      operationId: setPrinterFaults
      parameters:
      - explode: false
        in: path
        name: printerId
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Faults"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StateOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - bearerKey: []
      - headerKey: []
      summary: Inject or clear fault conditions
      tags:
      - Simulator
      x-codeSamples:
      - lang: bash
        label: curl
        source: |-
          curl https://api.stripyhorse.io/v1/printers/$PRINTER_ID/faults \
            -H "X-Api-Key: sh_live_YOUR_KEY" -H "Content-Type: application/json" \
            -d '{"paperOut":true}'
      - lang: php
        label: PHP
        source: |-
          $sim->setPrinterFaults($printerId, new StripyHorse\Model\Faults(['paper_out' => true]));
          // print something - it holds. Clear to flush:
          $sim->setPrinterFaults($printerId, new StripyHorse\Model\Faults());
      - lang: python
        label: Python
        source: |-
          sim.set_printer_faults(printer.id, Faults(paper_out=True))
          # print something - it holds. Clear to flush:
          sim.set_printer_faults(printer.id, Faults())
      - lang: csharp
        label: C#
        source: |-
          sim.SetPrinterFaults(printer.Id, new Faults(paperOut: true));
          // print something - it holds. Clear to flush:
          sim.SetPrinterFaults(printer.Id, new Faults());
      - lang: java
        label: Java
        source: |-
          sim.setPrinterFaults(printer.getId(), new Faults().paperOut(true));
          // print something - it holds. Clear to flush:
          sim.setPrinterFaults(printer.getId(), new Faults());
  /v1/printers/{printerId}/jobs:
    delete:
      operationId: clearJobs
      parameters:
      - explode: false
        in: path
        name: printerId
        required: true
        schema:
          type: string
        style: simple
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - bearerKey: []
      - headerKey: []
      summary: Delete all captured jobs
      tags:
      - Simulator
    get:
      description: For CI assertions and inbox views. Cursor-paged via before.
      operationId: listJobs
      parameters:
      - explode: false
        in: path
        name: printerId
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: query
        name: limit
        required: false
        schema:
          default: 50
          format: int64
          maximum: 200
          minimum: 1
          type: integer
        style: form
      - description: Return jobs with id lower than this cursor
        explode: false
        in: query
        name: before
        required: false
        schema:
          description: Return jobs with id lower than this cursor
          format: int64
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListJobsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - bearerKey: []
      - headerKey: []
      summary: "List captured jobs, newest first"
      tags:
      - Simulator
      x-codeSamples:
      - lang: bash
        label: curl
        source: |-
          curl https://api.stripyhorse.io/v1/printers/$PRINTER_ID/jobs \
            -H "X-Api-Key: sh_live_YOUR_KEY"
      - lang: php
        label: PHP
        source: |-
          $jobs = $sim->listJobs($printerId);
          assert(count($jobs->getJobs()) === 1);
          assert($jobs->getJobs()[0]->getStatus() === 'rendered');
      - lang: python
        label: Python
        source: |-
          jobs = sim.list_jobs(printer.id)
          assert len(jobs.jobs) == 1
          assert jobs.jobs[0].status == "rendered"
      - lang: csharp
        label: C#
        source: |-
          var jobs = sim.ListJobs(printer.Id);
          Debug.Assert(jobs.Jobs.Count == 1);
          Debug.Assert(jobs.Jobs[0].Status == "rendered");
      - lang: java
        label: Java
        source: |-
          ListJobsOutputBody jobs = sim.listJobs(printer.getId(), null, null);
          assert jobs.getJobs().size() == 1;
          assert "rendered".equals(jobs.getJobs().get(0).getStatus());
