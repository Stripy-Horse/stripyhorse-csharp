      - bearerKey: []
      - headerKey: []
      summary: Stamp an image onto ZPL labels
      tags:
      - Convert
  /v1/unicode:
    post:
      description: "Text fields containing characters the printer's fonts can't render\
        \ (Arabic with contextual joining and RTL, Cyrillic, and everything else beyond\
        \ ASCII) are shaped properly and re-emitted as ^GFA bitmaps at the field's\
        \ exact position and size. Every other byte (barcodes, ASCII text, graphics)\
        \ passes through untouched. Fields that can't be converted safely (rotated,\
        \ ^FH-escaped) are left unchanged and reported in `skipped`."
      operationId: rasterizeUnicode
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnicodeInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnicodeOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - bearerKey: []
      - headerKey: []
      summary: Make Unicode ZPL printable on any Zebra
      tags:
      - Convert
  /v1/void:
    post:
      description: "Overlays a large diagonal VOID - DO NOT MAIL warning (and an optional\
        \ attribution stamp) across every label in the stream, so printed dev and\
        \ test labels can never be mistaken for shippable ones. Original fields are\
        \ untouched; stamps draw on top."
      operationId: voidZpl
